<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>No Internet Connection — BENX VisionX</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(ellipse 100% 60% at 50% 0%, #0b1930 0%, #020617 70%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(155deg, rgba(15, 23, 42, 0.98) 0%, rgba(28, 18, 8, 0.98) 100%);
            border: 1px solid rgba(245, 158, 11, 0.45);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.85);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fcd34d;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fbbf24;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 22px;
            padding: 8px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p {
            font-size: 13px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(90deg, #d97706, #e11d48);
            color: #ffffff;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(217, 119, 6, 0.35);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <span class="dot"></span>
            <span>Connection Lost</span>
        </div>
        <div class="icon-wrap">
            <img src="/faceapk.png" alt="BENX App" />
        </div>
        <h1>No Internet Connection</h1>
        <p>You are currently not connected to the internet. Please reconnect your Wi-Fi or mobile data to continue.</p>
        <button onclick="window.location.reload()">Please Reconnect &amp; Try Again</button>
    </div>
    <script>
        window.addEventListener('online', function () {
            window.location.reload();
        });
    </script>
</body>
</html>
